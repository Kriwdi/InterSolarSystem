name: Build

on:
  push:
    branches-ignore:
      - ci-builds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          # Compile errors show up as annotations in the run summary.
          grep -E "error:|What went wrong|Could not|Exception|> " build.log | grep -v "^\s*at " | head -n 60 > errors.txt || true
          python3 - <<'EOF'
          lines = open("errors.txt", encoding="utf-8", errors="replace").read().splitlines()
          chunk = []
          for line in lines:
              chunk.append(line.replace("%", "%25").replace("\r", "").replace("\n", " "))
              if len(chunk) == 6:
                  print("::error::" + "%0A".join(chunk)); chunk = []
          if chunk:
              print("::error::" + "%0A".join(chunk))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: intersolarsystem
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Publish jar and log to the ci-builds branch
        if: always()
        shell: bash
        run: |
          mkdir -p out/jar
          cp build/libs/*.jar out/jar/ 2>/dev/null || true
          rm -f out/jar/*-sources.jar
          cp build.log out/ 2>/dev/null || true
          echo "Commit: ${GITHUB_SHA}" > out/BUILD_INFO.txt
          echo "Branch: ${GITHUB_REF_NAME}" >> out/BUILD_INFO.txt
          echo "Status: ${{ job.status }}" >> out/BUILD_INFO.txt
          cd out && git init -q -b ci-builds && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "build ${GITHUB_SHA}" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-builds || true
