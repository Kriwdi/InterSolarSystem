name: Client screenshots

# Starts a real Minecraft client with the mod in a virtual display (software OpenGL), builds the mod's scenes and
# takes screenshots (src/gametest). Publishes them with the client log to the ci-screens branch.

on:
  push:
    branches-ignore:
      - ci-builds
      - ci-probe
      - ci-screens
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Virtual display and software OpenGL
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 \
            mesa-vulkan-drivers libvulkan1 vulkan-tools mesa-utils > /dev/null
          # Sanity check of the software OpenGL stack.
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" glxinfo -B || true
      - name: Run client game test
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: |
          chmod +x gradlew
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace 2>&1 | tee client.log || true
      - name: Publish screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name "*.png" -path "*screenshots*" -print -exec cp {} out/ \; || true
          cp client.log out/ 2>/dev/null || true
          find . -name "latest.log" -path "*logs*" -exec cp {} out/latest.log \; 2>/dev/null || true
          find . -name "hs_err*.log" -exec cp {} out/ \; 2>/dev/null || true
          echo "Commit: ${GITHUB_SHA}" > out/INFO.txt
          cd out && git init -q -b ci-screens && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "screens ${GITHUB_SHA}" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens || true
